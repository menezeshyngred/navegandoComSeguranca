<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ferramentas Digitais</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen active">
            <!-- <img src="imagens/icone.png" alt="Ícone de segurança" class="quiz-icon"> -->
            <h1> As ferramentas digitais estão por toda parte…será que você sabe aproveitar o melhor delas?</h1>
            <button onclick="startQuiz()">Começar Quiz</button>
        </div>
    
        <div id="quiz-screen" class="screen">
            <div id="question"></div>
            <div id="answers"></div>
        </div>

        <div id="result-screen" class="screen">
            <h2>Resultado</h2>
            <p id="score-text"></p>
            <button onclick="restartQuiz()">Tentar Novamente</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Quando você precisa guardar arquivos e acessá-los de qualquer lugar, qual ferramenta é a melhor opção?",
                answers:[
                    { text:"Google Drive.", correct: true},
                    { text:"Trello ", correct: false},
                    { text:"Canva ", correct: false},
                    { text:"Word ", correct: false},
                ],
            },
            {
                question: "Qual dessas ferramentas é ideal para criar apresentações e posts com aparência profissional, mesmo sem ser designer?",
                answers:[
                    { text: " Google Docs", correct: false},
                    { text: "Canva", correct: true},
                    { text: "Trello", correct: false},
                    { text: "ChatGPT", correct: false},
                ],
            },
            {
                question: "Você quer organizar suas tarefas da semana de forma visual e prática. O que usa?",
                answers:[
                    { text: " Google Drive", correct: false},
                    { text: "Trello", correct: true},
                    { text: "Google Forms.", correct: false},
                    { text: "Docs", correct: false},
                ],
            },
            {
                question: "Se você quer fazer um formulário para coletar opiniões ou listas de presença, qual ferramenta escolhe?",
                answers:[
                    { text:"Google Forms", correct: true},
                    { text:"Trello", correct: false},
                    { text:"Word", correct: false},
                    { text:"ChatGPT", correct: false},
                ],
            },
            {
                question: "Qual dessas ferramentas permite editar um texto com outras pessoas ao mesmo tempo, salvando tudo automaticamente?",
                answers:[
                    { text: "Google Docs.", correct: true},
                    { text: "Canva", correct: false},
                    { text: " Word Offline", correct: false},
                    { text: " Trello", correct: false},
                ],
            },
            {
                question: "Você precisa revisar um texto, gerar ideias ou pedir ajuda para planejar algo. Qual é o seu aliado perfeito?",
                answers:[
                    { text: "Google Drive", correct: false},
                    { text: "ChatGPT ", correct: true},
                    { text: "Trello", correct: false},
                     { text: "Canva", correct: false},
                ],
            },
            {
                question: "Para manter seus arquivos bem organizados no Drive, o que é recomendado?",
                answers:[
                    { text:"Criar pastas separadas para cada tipo de conteúdo", correct: true},
                    { text:"Deixar tudo solto na pasta principal", correct: false},
                    { text:"Mover tudo para o lixo", correct: false},
                    { text:"Compartilhar com todo mundo", correct: false},
                ],
            },
            {
                question: "Qual dessas atitudes mostra que você usa a tecnologia de forma consciente?",
                answers:[
                    { text: "Baixar tudo que aparece na internet", correct: false},
                    { text: "Aprender e usar apenas o que facilita sua rotina", correct: true},
                    { text: "Evitar qualquer ferramenta nova", correct: false},
                    { text: "Guardar senhas em um bloco de notas", correct: false},
                ],
            },
           
        ];

        let currentQuestion = 0;
        let score= 0;

        const startScreen = document.getElementById("start-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionE1 = document.getElementById("question");
        const answerE1 = document.getElementById("answers");
        const scoreText = document.getElementById("score-text");

        function startQuiz() {
            startScreen.classList.remove("active");
            quizScreen.classList.add("active");
            currentQuestion = 0;
            score =0;
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            questionE1.textContent = q.question;
            answerE1.innerHTML = "";

            q.answers.forEach((answer)  => {
                const btn = document.createElement("button");
                btn.textContent = answer.text;
                btn.classList.add("answer-btn");
                btn.onclick = () => handleAnswer(btn, answer.correct);
                answerE1.appendChild(btn);
            });
            }

        function handleAnswer(button, isCorrect) {
            const buttons = document.querySelectorAll(".answer-btn");

            buttons.forEach(btn => btn.disabled = true); //destiva todos os butões.

            if(isCorrect) {
                button.classList.add("correct");
                score++;
                } else {
                    button.classList.add("wrong");

                    const correctAnswer = questions[currentQuestion].answers.find(a => a.correct).text;
                    buttons.forEach(btn => {
                        if (btn.textContent === correctAnswer) {
                            btn.classList.add("correct");
                        }
                        
                    });
                }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    endQuiz();
                }
            }, 1000);
        }
       /* function checkAnswer(correct) {
            if (correct) score++;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                    showQuestion();
            } else {
                endQuiz();
            }
        }*/

        function endQuiz() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");
                    
            let message = "";
            if (score === questions.length) {
                message = "Parabéns! Você é um ninja da segurança digital!";
            } else if (score >= 5) {
                message = "Mandou bem! mas ainda dá pra reforçar sua defesa.";
            }   else {
                message = "Ops! Alerta vermelho! Hora de aprender a se proteger.";
            }

            scoreText.innerHTML = `Você acertou ${score} de ${questions.length} perguntas.<br> ${message}`;
            }
            
            function restartQuiz() {
                resultScreen.classList.remove("active");
                startScreen.classList.add("active");
            }
            
        showQuestion();
</script>
</body>
</html>
